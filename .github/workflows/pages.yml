name: Deploy static site to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build generated program images
        shell: bash
        run: |
          mkdir -p assets/images
          base64 -d .site-assets/program-weekend.b64 > assets/images/program-weekend.avif
          base64 -d .site-assets/program-camps.b64 > assets/images/program-camps.avif
          base64 -d .site-assets/program-workshops.b64 > assets/images/program-workshops.avif
          base64 -d .site-assets/program-team.b64 > assets/images/program-team.avif
          base64 -d .site-assets/program-expeditions.b64 > assets/images/program-expeditions.avif
          test -s assets/images/program-weekend.avif
          test -s assets/images/program-camps.avif
          test -s assets/images/program-workshops.avif
          test -s assets/images/program-team.avif
          test -s assets/images/program-expeditions.avif
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
