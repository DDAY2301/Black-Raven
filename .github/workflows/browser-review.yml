name: Black Raven browser visual QA
on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "assets/css/**"
      - "assets/js/**"
      - ".github/workflows/browser-review.yml"
      - "tools/browser_smoke.js"
  workflow_dispatch:
concurrency:
  group: black-raven-browser-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local preview server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/black-raven-server.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8765/ > /dev/null
      - name: Test desktop, tablet and mobile layouts
        run: node tools/browser_smoke.js
      - name: Upload screenshots and QA report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: black-raven-visual-qa
          path: visual-qa/
          if-no-files-found: warn
          retention-days: 7
