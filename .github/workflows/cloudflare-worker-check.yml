name: Black Raven Cloudflare Worker verification
on:
  push:
    branches:
      - feature/cloudflare-direct-godaddy-smtp-20261108
    paths:
      - "worker/**"
      - "backend/lib.js"
      - ".github/workflows/cloudflare-worker-check.yml"
  pull_request:
    paths:
      - "worker/**"
      - "backend/lib.js"
      - ".github/workflows/cloudflare-worker-check.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check SMTP and Worker source
        run: |
          node --check worker/src/index.js
          node --check worker/src/smtp.js
          node --test worker/test/*.test.mjs
      - name: Install Wrangler
        run: npm install --prefix worker --no-audit --no-fund
      - name: Bundle Worker without deploying
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir ../worker-bundle-verify
