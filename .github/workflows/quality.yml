name: Black Raven quality gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML links, language coverage, image files and sitemap
        run: python3 tools/site_quality.py
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/contact-form.js
          node --check backend/server.js
          node --check backend/lib.js
          node --test backend/tests/validation.test.js
